jdk:
  - openjdk21

before_install:
  - sdkmanager "ndk;29.0.14206865" --channel=0 || true
  - export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865
  - chmod +x build-android.sh
  - ./build-android.sh
  - mv openssl-*.aar openssl-${VERSION}.aar

install:
  - mvn install:install-file
      -Dfile=openssl-${VERSION}.aar
      -DgroupId=com.github.nextcloud-deps
      -DartifactId=nextcloud-openssl
      -Dversion=${VERSION}
      -Dpackaging=aar
      -DgeneratePom=true
