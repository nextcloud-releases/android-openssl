name: Build Android OpenSSL AAR

on:
  push:
    tags:
      - 'openssl-*'
  workflow_dispatch:
    inputs:
      openssl_version:
        description: 'OpenSSL version (e.g. 3.5.6)'
        required: true
        default: '3.5.6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build OpenSSL ${{ github.event.inputs.openssl_version || '3.5.6' }} AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache OpenSSL source
        uses: actions/cache@v4
        with:
          path: build/src
          key: openssl-src-${{ github.event.inputs.openssl_version || '3.5.6' }}

      - name: Build OpenSSL AAR
        run: |
          chmod +x build-android.sh
          OPENSSL_VERSION="${{ github.event.inputs.openssl_version || '3.5.6' }}" ./build-android.sh

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: openssl-${{ github.event.inputs.openssl_version || '3.5.6' }}.aar
          path: openssl-*.aar
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openssl-*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
